services:
  postgres-test:
    image: postgres:16-alpine
    container_name: tellme-postgres-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: tellme_test
    ports:
      - '${TEST_POSTGRES_PORT:-5439}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d tellme_test']
      interval: 2s
      timeout: 2s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    container_name: tellme-redis-test
    ports:
      - '${TEST_REDIS_PORT:-6389}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 10