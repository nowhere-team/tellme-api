services:
  postgres:
    image: postgres:alpine
    container_name: tellme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tellme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tellme}
      POSTGRES_DB: ${POSTGRES_DB:-tellme}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tellme}']
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:alpine
    container_name: tellme-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 5s
      timeout: 3s
      retries: 5


volumes:
  postgres-data:
  redis-data:

networks:
  shared-network:
    external: true