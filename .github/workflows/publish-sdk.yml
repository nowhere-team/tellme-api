name: Publish Tellme SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump (patch/minor/major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      id-token: write

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tellme_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d tellme_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@nowhere-team'

      - name: Install dependencies
        run: bun install --frozen-lockfile
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Biome
        uses: biomejs/setup-biome@v2

      - name: Run Biome
        run: biome ci

      - name: Type check
        working-directory: packages/sdk
        run: bun run typecheck

      - name: Run tests
        working-directory: packages/sdk
        run: bun run test
        env:
          TEST_POSTGRES_PORT: 5433
          TEST_REDIS_PORT: 6380

      - name: Build
        working-directory: packages/sdk
        run: bun run build

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        working-directory: packages/sdk
        run: |
          npm version ${{ inputs.version }} --no-git-tag-version --no-workspaces-update
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Publish to GitHub Packages
        working-directory: packages/sdk
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and tag
        run: |
          git add packages/sdk/package.json
          git commit -m "chore(tellme-sdk): release v${{ env.VERSION }}"
          git tag "tellme-sdk-v${{ env.VERSION }}"
          git push
          git push --tags
